<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Redirigiendo... | Onlimed Posadas</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var repo = '/onlimed-public';
      var cleanPath = path.startsWith(repo) ? path.slice(repo.length) : path;
      var base = path.startsWith(repo) ? repo : '';

      // Redirigir /profesionales/:id hacia /profesionales?id=:id
      var profMatch = cleanPath.match(/^\/profesionales\/([a-zA-Z0-9\-_]+)\/?$/);
      if (profMatch) {
        var doctorId = profMatch[1];
        window.location.replace(base + '/profesionales?id=' + encodeURIComponent(doctorId));
        return;
      }

      // Redirigir rutas principales en caso de acceso directo
      if (cleanPath.startsWith('/panel-medico')) {
        window.location.replace(base + '/panel-medico');
        return;
      }
      if (cleanPath.startsWith('/admin')) {
        window.location.replace(base + '/admin');
        return;
      }
      if (cleanPath.startsWith('/profesionales')) {
        window.location.replace(base + '/profesionales' + (window.location.search || ''));
        return;
      }

      window.location.replace(base + '/');
    })();
  </script>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #475569;">
  <div style="text-align: center; padding: 20px;">
    <div style="width: 40px; height: 40px; border: 4px solid #0284c7; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
    <p style="font-size: 14px; font-weight: 600;">Cargando Onlimed Posadas...</p>
  </div>
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
